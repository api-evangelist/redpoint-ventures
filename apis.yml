aid: redpoint-ventures
name: Redpoint Ventures
description: >-
  Redpoint Ventures is a Silicon Valley venture capital firm founded in 1999 and
  headquartered in Menlo Park, California, with additional offices in San
  Francisco and Los Angeles and a history of China-focused funds in Beijing and
  Shanghai. Redpoint is a multi-stage investor that backs founders from seed and
  early stage through growth, running dedicated early-stage and growth teams.
  The firm invests across enterprise software and SaaS, AI and AI
  infrastructure, cloud and data infrastructure, developer tools, cybersecurity,
  fintech, consumer internet, healthcare, crypto/web3, and marketplaces. Typical
  checks range from roughly $0.5M-$2M at seed and $2M-$8M at Series A up to $10M+
  at growth stage. As of 2025 Redpoint managed about $4.5 billion in assets, and
  its partners have participated in 130+ IPOs and acquisitions including Netflix,
  Snowflake, Twilio, Pure Storage, Zendesk, Stripe, HashiCorp, and HomeAway. The
  firm launched its tenth flagship fund, a $650M vehicle, in 2025, and publishes
  the annual InfraRed report on the leading private cloud and infrastructure
  companies. This profile tracks Redpoint's identity and its portfolio graph
  across the API Evangelist network.
